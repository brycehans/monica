name: Unit tests

on:
  push:
    branches:
      - main
      - 4.x
  pull_request:
    types: [opened, synchronize, reopened]
    branches-ignore: ['l10n_main*']
  release:
    types: [created]

env:
  default-php-version: '8.4'
  node-version: 20

concurrency:
  group: Unit tests ${{ github.ref }}
  cancel-in-progress: true

jobs:
  #############
  # Run tests
  #############
  tests:
    runs-on: ubuntu-latest
    name: Testsuite ${{ matrix.testsuite }} with PHP ${{ matrix.php-version }} (${{ matrix.connection }})

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
        connection: [mysql]
        testsuite: [Api, Feature, Commands-Other, Commands-Scheduling, Unit-Models, Unit-Services]

    services:
      stripe-mock:
        image: stripe/stripe-mock:v0.199.0
        ports:
          - 12111:12111

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: redis, ${{ matrix.connection }}
          coverage: none
      - name: Check PHP Version
        run: php -v
      - name: Check Composer Version
        run: composer -V
      - name: Check PHP Extensions
        run: php -m

    # Composer
      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache composer files
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
            ${{ runner.os }}-composer-${{ matrix.php-version }}
            ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader $ext

    # Prepare
      - name: Prepare environment
        run: |
          cp scripts/ci/.env.${{ matrix.connection }} .env
          touch config/.version config/.release config/.commit
          mkdir -p public/build/assets results/coverage
          # Stub Vite manifest so @vite() directives in Blade resolve. Tests
          # never load these assets — the files don't need to exist on disk.
          cat > public/build/manifest.json <<'JSON'
          {
            "resources/js/app.ts":        {"file": "assets/app.js",        "src": "resources/js/app.ts",        "isEntry": true, "name": "app"},
            "resources/js/stripe.ts":     {"file": "assets/stripe.js",     "src": "resources/js/stripe.ts",     "isEntry": true, "name": "stripe"},
            "resources/sass/app-ltr.scss":{"file": "assets/app-ltr.css",   "src": "resources/sass/app-ltr.scss","isEntry": true, "name": "app-ltr"},
            "resources/sass/app-rtl.scss":{"file": "assets/app-rtl.css",   "src": "resources/sass/app-rtl.scss","isEntry": true, "name": "app-rtl"},
            "resources/sass/stripe.scss": {"file": "assets/stripe.css",    "src": "resources/sass/stripe.scss", "isEntry": true, "name": "stripe-css"}
          }
          JSON

      - name: Generate key
        run: php artisan key:generate

      - name: Start mysql
        if: matrix.connection == 'mysql'
        run: sudo systemctl start mysql.service
      - name: Create database
        if: matrix.connection == 'mysql'
        run: mysql --protocol=tcp -u root -proot -e "CREATE DATABASE IF NOT EXISTS monica CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      - name: Prepare database
        if: matrix.connection == 'mysql'
        run: mysql --protocol=tcp -u root -proot monica < scripts/database.test.sql
      - name: Run migrations
        run: php artisan migrate --no-interaction -vvv

      - name: Run seeds
        run: php artisan db:seed --no-interaction -vvv
      - name: Create passport keys
        run: php artisan passport:keys --no-interaction -vvv
      - name: Cache route
        run: php artisan route:cache

    # Test
      - name: Run Unit test suite
        run: vendor/bin/phpunit -c phpunit.xml --testsuite ${{ matrix.testsuite }} --log-junit ./results/junit/results${{ matrix.testsuite }}.xml
        env:
          DB_CONNECTION: ${{ matrix.connection }}
          # stripe-mock is a GH Actions service container on the runner host;
          # reach it via localhost (the published port), not the service-name
          # DNS that only resolves inside container-based jobs.
          STRIPE_API_BASE: http://localhost:12111

      - name: Fix results files
        run: sed -i -e "s%$GITHUB_WORKSPACE/%%g" **/*.xml
        working-directory: results

      - name: Store results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.testsuite }}-php${{ matrix.php-version }}
          path: results


  #################
  # Browser tests #
  #################
  tests_browser:
    runs-on: ubuntu-latest
    name: Tests browser with PHP ${{ matrix.php-version }} (${{ matrix.connection }})

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
        connection: [mysql]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: redis, ${{ matrix.connection }}
          coverage: none
      - name: Check PHP Version
        run: php -v
      - name: Check Composer Version
        run: composer -V
      - name: Check PHP Extensions
        run: php -m

    # Composer
      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache composer files
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
            ${{ runner.os }}-composer-${{ matrix.php-version }}
            ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

    # Yarn — Dusk renders real Blade views, so assets need to be built (the
    # `tests:` job above can get away with stubbing public/build/manifest.json
    # because phpunit never loads them; browser tests do).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
          cache: yarn

      - name: Install yarn dependencies
        run: yarn inst

      - name: Build assets
        run: yarn run prod

    # Prepare
      - name: Prepare environment
        run: |
          cp scripts/ci/.env.${{ matrix.connection }} .env
          touch config/.version config/.release config/.commit
          mkdir -p results/junit results/screenshots results/console results/source
          chmod -R 777 storage bootstrap/cache

      - name: Generate key
        run: php artisan key:generate

      - name: Start mysql
        if: matrix.connection == 'mysql'
        run: sudo systemctl start mysql.service
      - name: Create database
        if: matrix.connection == 'mysql'
        run: mysql --protocol=tcp -u root -proot -e "CREATE DATABASE IF NOT EXISTS monica CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      - name: Prepare database
        if: matrix.connection == 'mysql'
        run: mysql --protocol=tcp -u root -proot monica < scripts/database.test.sql
      - name: Run migrations
        run: php artisan migrate --no-interaction -vvv

      - name: Run seeds
        run: php artisan db:seed --no-interaction -vvv
      - name: Create passport keys
        run: php artisan passport:keys --no-interaction -vvv
      - name: Cache route
        run: php artisan route:cache

    # Browser stack — install ChromeDriver via Dusk's bundled downloader,
    # then start it manually so it's bound on :9515 *before* `php artisan
    # dusk` connects. DuskTestCase::prepare()'s own startChromeDriver()
    # uses Symfony Process::start() which forks and returns immediately —
    # without a readiness wait the first RemoteWebDriver::create() hits
    # `Connection refused` and every test errors out. The 2-second sleep +
    # /status probe is the actual fix; explicit `--port=9515` matches
    # Dusk's default DriverUrl. Log to /tmp on failure so the next
    # regression isn't silenced by `>/dev/null 2>&1`.
      - name: Install Chrome Driver
        run: php artisan dusk:chrome-driver --detect

      - name: Start Chrome Driver
        run: |
          ./vendor/laravel/dusk/bin/chromedriver-linux --port=9515 >/tmp/chromedriver.log 2>&1 &
          echo $! > /tmp/chromedriver.pid
          sleep 2
          if ! kill -0 "$(cat /tmp/chromedriver.pid)" 2>/dev/null; then
            echo "chromedriver died — log:"; cat /tmp/chromedriver.log; exit 1
          fi
          curl -sS --max-time 5 http://localhost:9515/status \
            || (echo "chromedriver not responding — log:"; cat /tmp/chromedriver.log; exit 1)

      - name: Run http server
        run: php -S localhost:8000 -t public >/dev/null 2>&1 &

      - name: Run browser tests
        run: php artisan dusk --log-junit results/junit/resultsBrowser.xml
        env:
          DB_CONNECTION: ${{ matrix.connection }}
          APP_URL: http://localhost:8000

      - name: Fix results files
        if: always()
        run: sed -i -e "s%$GITHUB_WORKSPACE/%%g" **/*.xml
        working-directory: results

      - name: Store results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-browser-php${{ matrix.php-version }}
          path: results
